[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pslab"
version = "0.1.0"
description = "Clean room PSD parser and Photoshop style blend and compositing engine"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Navid Khan" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "Pillow>=9.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
pslab = "pslab.cli:main"

[tool.setuptools]
packages = ["pslab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
